    <!-- 六一儿童节彩蛋装饰样式 -->
    <style>
        /* 真正的气球形状 */
        .balloon {
            position: fixed;
            width: 40px;
            height: 50px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: float 6s ease-in-out infinite;
            z-index: 1000;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                inset -10px -10px 0 rgba(0,0,0,0.1),
                0 5px 15px rgba(0,0,0,0.2);
        }

        .balloon:hover {
            transform: scale(1.15) rotate(5deg);
            filter: brightness(1.1);
        }

        .balloon::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 60px;
            background: linear-gradient(to bottom, #666, #333);
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 1px;
        }

        .balloon::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: inherit;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            filter: brightness(0.8);
        }

        .balloon-1 {
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            top: 15%; left: 3%; animation-delay: 0s;
        }
        .balloon-2 {
            background: linear-gradient(135deg, #4ecdc4, #26a69a);
            top: 25%; right: 5%; animation-delay: 1s;
        }
        .balloon-3 {
            background: linear-gradient(135deg, #45b7d1, #2196f3);
            top: 10%; left: 12%; animation-delay: 2s;
        }
        .balloon-4 {
            background: linear-gradient(135deg, #f9ca24, #f39c12);
            top: 20%; right: 12%; animation-delay: 3s;
        }
        .balloon-5 {
            background: linear-gradient(135deg, #f0932b, #e67e22);
            top: 30%; left: 6%; animation-delay: 4s;
        }
        .balloon-6 {
            background: linear-gradient(135deg, #eb4d4b, #c0392b);
            top: 35%; right: 8%; animation-delay: 5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(-10px) rotate(-1deg); }
        }

        /* 更精美的彩虹装饰 */
        .rainbow {
            position: fixed;
            top: 15px;
            right: 25px;
            width: 120px;
            height: 60px;
            background: linear-gradient(90deg,
                #ff0000 0%, #ff7f00 16.66%, #ffff00 33.33%,
                #00ff00 50%, #0000ff 66.66%, #4b0082 83.33%, #9400d3 100%);
            border-radius: 120px 120px 0 0;
            opacity: 0.85;
            z-index: 999;
            animation: rainbow-glow 4s ease-in-out infinite alternate;
            box-shadow: 0 4px 20px rgba(255,255,255,0.3);
        }

        .rainbow::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 0;
            background: linear-gradient(90deg,
                rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.3) 100%);
            border-radius: 104px 104px 0 0;
        }

        @keyframes rainbow-glow {
            0% { opacity: 0.7; transform: scale(1) translateY(0px); }
            100% { opacity: 0.95; transform: scale(1.08) translateY(-2px); }
        }

        /* 精美的六一祝福卡片 */
        .children-day-wish {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(248,249,250,0.95));
            padding: 15px 20px;
            border-radius: 25px;
            font-size: 15px;
            color: #ff6b6b;
            font-weight: 600;
            box-shadow:
                0 8px 32px rgba(255,107,107,0.2),
                0 4px 16px rgba(0,0,0,0.1);
            z-index: 1001;
            animation: wish-pulse 3s ease-in-out infinite;
            cursor: pointer;
            border: 2px solid rgba(255,107,107,0.3);
            backdrop-filter: blur(10px);
        }

        .children-day-wish:hover {
            transform: translateY(-3px);
            box-shadow:
                0 12px 40px rgba(255,107,107,0.3),
                0 6px 20px rgba(0,0,0,0.15);
        }

        @keyframes wish-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* 更美的星星效果 */
        .star {
            position: fixed;
            font-size: 24px;
            animation: twinkle 3s ease-in-out infinite;
            z-index: 998;
            pointer-events: none;
            filter: drop-shadow(0 0 6px currentColor);
        }

        .star-1 { top: 8%; left: 20%; animation-delay: 0s; color: #ffd700; }
        .star-2 { top: 18%; right: 30%; animation-delay: 0.8s; color: #ff69b4; }
        .star-3 { top: 55%; left: 8%; animation-delay: 1.6s; color: #00bfff; }
        .star-4 { top: 65%; right: 15%; animation-delay: 2.4s; color: #98fb98; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.4; transform: scale(1) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.3) rotate(180deg); }
        }

        /* 隐蔽的魔法按钮 */
        .magic-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 1002;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow:
                0 6px 20px rgba(102,126,234,0.4),
                0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .magic-toggle:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow:
                0 8px 25px rgba(102,126,234,0.5),
                0 4px 12px rgba(0,0,0,0.15);
        }

        .magic-toggle:active {
            transform: scale(0.95);
        }

        .magic-toggle::before {
            content: '✨';
            transition: all 0.3s ease;
        }

        .magic-toggle.active::before {
            content: '🌙';
            transform: rotate(180deg);
        }
    </style>

<body>

    <!-- 主脚本，无需修改 -->

    <!-- 六一儿童节彩蛋交互脚本 -->
    <script>
        // 气球点击爆炸效果
        function popBalloon(balloon) {
            balloon.style.transform = 'scale(0)';
            balloon.style.opacity = '0';

            // 创建爆炸效果
            const explosion = document.createElement('div');
            explosion.innerHTML = '🎉';
            explosion.style.position = 'fixed';
            explosion.style.left = balloon.style.left;
            explosion.style.top = balloon.style.top;
            explosion.style.fontSize = '30px';
            explosion.style.zIndex = '1003';
            explosion.style.animation = 'explosion 1s ease-out forwards';
            explosion.style.pointerEvents = 'none';

            document.body.appendChild(explosion);

            // 1秒后移除爆炸效果和气球
            setTimeout(() => {
                explosion.remove();
                balloon.remove();
            }, 1000);
        }

        // 祝福消息点击效果
        function showWish() {
            const wishes = [
                '🎈 愿你的眼中总有光芒，活成你想要的模样！',
                '🌟 童年只有一次，成长不会再来，愿你珍惜每一天！',
                '� 愿你像小熊一样勇敢，像小鸟一样自由，像彩虹一样多彩！',
                '🎨 愿你拥有童真、童心、童颜，保持儿童时的笑脸！',
                '� 童年很短未来很长，愿你成长的每一天所遇皆甜！',
                '🎁 愿你的生活充满欢笑和惊喜，快乐健康成长！',
                '✨ 愿你在成长的路上遇见彩色的梦和超级多的小美好！',
                '� 愿你的童年像一首美妙的歌曲，永远充满动听的旋律！',
                '� 愿你的六一儿童节像彩虹一样绚丽多彩，带给你无尽的快乐！',
                '� 童年的快乐是世界上最美好的礼物，愿你永远快乐！'
            ];

            const randomWish = wishes[Math.floor(Math.random() * wishes.length)];

            // 创建临时祝福弹窗
            const wishPopup = document.createElement('div');
            wishPopup.innerHTML = randomWish;
            wishPopup.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #f9ca24);
                color: white;
                padding: 20px 30px;
                border-radius: 25px;
                font-size: 18px;
                font-weight: bold;
                text-align: center;
                z-index: 1004;
                box-shadow: 0 8px 25px rgba(0,0,0,0.2);
                animation: wishShow 3s ease-in-out forwards;
            `;

            document.body.appendChild(wishPopup);

            // 3秒后移除
            setTimeout(() => {
                wishPopup.remove();
            }, 3000);
        }

        // 魔法模式切换
        function toggleDecorations() {
            const decorations = document.getElementById('children-day-decorations');
            const button = document.querySelector('.magic-toggle');

            if (decorations.style.display === 'none') {
                decorations.style.display = 'block';
                button.classList.remove('active');
                button.title = '关闭魔法模式';

                // 添加魔法出现效果
                decorations.style.animation = 'magicAppear 0.8s ease-out forwards';
            } else {
                decorations.style.display = 'none';
                button.classList.add('active');
                button.title = '开启魔法模式';
            }
        }

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes explosion {
                0% { transform: scale(1) rotate(0deg); opacity: 1; }
                50% { transform: scale(2.5) rotate(180deg); opacity: 0.8; }
                100% { transform: scale(4) rotate(360deg); opacity: 0; }
            }

            @keyframes wishShow {
                0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
                20% { transform: translate(-50%, -50%) scale(1.15) rotate(2deg); opacity: 1; }
                80% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
                100% { transform: translate(-50%, -50%) scale(0.9) rotate(5deg); opacity: 0; }
            }

            @keyframes magicAppear {
                0% { opacity: 0; transform: scale(0.8); }
                50% { opacity: 0.7; transform: scale(1.05); }
                100% { opacity: 1; transform: scale(1); }
            }
        `;
        document.head.appendChild(style);

        // 页面加载完成后的欢迎效果
        window.addEventListener('load', function() {
            setTimeout(() => {
                showWish();
            }, 2000);
        });
    </script>
